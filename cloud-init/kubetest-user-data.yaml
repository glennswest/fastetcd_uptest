#cloud-config
# kubetest.g8.lo — Fedora 43 cloud-init that installs upstream
# kubeadm and stands up a single-node Kubernetes control plane.
#
# This is the variant-A baseline ("vanilla upstream Kubernetes")
# for the fastetcd_uptest comparison. A second VM kubetest-b will
# layer the etcd→fastetcd swap on top.

hostname: kubetest
fqdn: kubetest.g8.lo
prefer_fqdn_over_hostname: true

users:
  - name: fedora
    groups: [wheel, adm, systemd-journal]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-rsa  gwest@Glenns-MacBook-Pro.local

ssh_pwauth: false
disable_root: false
ssh_authorized_keys:
  - ssh-rsa  gwest@Glenns-MacBook-Pro.local

package_update: true
package_upgrade: false

packages:
  - qemu-guest-agent
  - containerd
  - iptables
  - iproute-tc
  - jq
  - curl

write_files:
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

  - path: /etc/sysctl.d/99-k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

  - path: /etc/yum.repos.d/kubernetes.repo
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/v1.31/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/v1.31/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

  - path: /usr/local/bin/kubetest-init.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euxo pipefail
      # Disable swap (kubeadm requires).
      swapoff -a || true
      sed -i.bak '/ swap / s/^/#/' /etc/fstab || true
      # Permissive selinux (matches the upstream kubeadm setup
      # instructions for Fedora/RHEL — production hardening can
      # re-enable enforcing with appropriate policy).
      setenforce 0 || true
      sed -i 's/^SELINUX=enforcing/SELINUX=permissive/' /etc/selinux/config || true
      # Open the firewall for control-plane + flannel.
      systemctl is-active firewalld >/dev/null && firewalld_active=yes || firewalld_active=no
      if [ "$firewalld_active" = yes ]; then
        firewall-cmd --permanent --add-port=6443/tcp
        firewall-cmd --permanent --add-port=2379-2380/tcp
        firewall-cmd --permanent --add-port=10250/tcp
        firewall-cmd --permanent --add-port=10257/tcp
        firewall-cmd --permanent --add-port=10259/tcp
        firewall-cmd --permanent --add-port=8472/udp
        firewall-cmd --permanent --add-port=2381/tcp
        firewall-cmd --reload
      fi
      modprobe overlay
      modprobe br_netfilter
      sysctl --system
      # containerd config (use systemd cgroup driver to match kubelet).
      mkdir -p /etc/containerd
      containerd config default > /etc/containerd/config.toml
      sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
      systemctl restart containerd
      systemctl enable --now containerd
      # Install kubeadm/kubelet/kubectl 1.31.
      dnf install -y --disableexcludes=kubernetes \
          kubelet-1.31.4 kubeadm-1.31.4 kubectl-1.31.4
      systemctl enable --now kubelet
      # kubeadm init. Single-node, control-plane untainted below.
      kubeadm init \
          --pod-network-cidr=10.244.0.0/16 \
          --service-cidr=10.96.0.0/12 \
          --ignore-preflight-errors=NumCPU,Mem
      mkdir -p /home/fedora/.kube
      cp /etc/kubernetes/admin.conf /home/fedora/.kube/config
      chown -R fedora:fedora /home/fedora/.kube
      mkdir -p /root/.kube
      cp /etc/kubernetes/admin.conf /root/.kube/config
      KUBECONFIG=/etc/kubernetes/admin.conf kubectl taint nodes --all node-role.kubernetes.io/control-plane- || true
      # Flannel CNI.
      KUBECONFIG=/etc/kubernetes/admin.conf kubectl apply -f \
        https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      # Mark ready so the orchestrator outside knows.
      touch /var/lib/kubetest.done

runcmd:
  - [ systemctl, enable, --now, qemu-guest-agent ]
  - bash -c '/usr/local/bin/kubetest-init.sh > /var/log/kubetest-init.log 2>&1 || true'

final_message: "kubetest.g8.lo cloud-init complete in $UPTIME seconds"
